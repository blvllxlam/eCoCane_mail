name: Deploy eCoCane Retail Email

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'style.css'
      - 'images/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload email template to SpaceWeb (FTP, upload only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          from pathlib import Path

          required = ("FTP_SERVER", "FTP_USERNAME", "FTP_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Secrets: " + ", ".join(missing))

          local_root = Path(".")
          files = [Path("index.html"), Path("style.css")]
          images_dir = Path("images")
          if images_dir.is_dir():
              files.extend(path for path in images_dir.rglob("*") if path.is_file())

          files = [path for path in files if path.is_file()]
          if not Path("index.html").is_file():
              raise SystemExit("index.html was not found")

          remote_root = "public_html/eCoCane_mail"

          with ftplib.FTP() as ftp:
              ftp.connect(os.environ["FTP_SERVER"], 21, timeout=30)
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              ftp.cwd("/")

              def ensure_dir(path):
                  for part in path.split("/"):
                      if not part:
                          continue
                      try:
                          ftp.cwd(part)
                      except ftplib.error_perm:
                          ftp.mkd(part)
                          ftp.cwd(part)

              ensure_dir(remote_root)

              for local_path in files:
                  relative = local_path.as_posix()
                  parent = str(Path(remote_root) / Path(relative).parent).replace("\\\\", "/")
                  ftp.cwd("/")
                  ensure_dir(parent)
                  with local_path.open("rb") as file:
                      ftp.storbinary("STOR " + local_path.name, file)
                  print("Uploaded:", relative)

          print("Email template deployed successfully. Remote files were not deleted.")
          PY
